<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc"><title id="title">流式视频生成的发展历程</title><desc id="desc">CausVid 到 Self Forcing，下分学生模型初始化、长程训练、历史选择与位置编码三个方向。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8c9b92" stroke-width="1.4" /></marker></defs><rect width="1200" height="665" fill="white" /><g font-family="Arial, PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="410" y="30" width="380" height="105" rx="10" fill="#f3f6f3" stroke="#cedbd2" /><text x="600" y="67" text-anchor="middle" font-size="25" font-weight="600" fill="#254c38">CausVid</text><text x="600" y="105" text-anchor="middle" font-size="20" font-weight="400" fill="#53615a">从整段生成到流式输出</text><path d="M600 135 V185" fill="none" stroke="#8c9b92" stroke-width="2" marker-end="url(#arrow)" /><rect x="410" y="185" width="380" height="105" rx="10" fill="#f3f6f3" stroke="#cedbd2" /><text x="600" y="224" text-anchor="middle" font-size="25" font-weight="600" fill="#254c38">Self Forcing</text><text x="600" y="263" text-anchor="middle" font-size="20" font-weight="400" fill="#53615a">在自生成历史上训练</text><path d="M600 290 V330 H210 V375" fill="none" stroke="#8c9b92" stroke-width="2" marker-end="url(#arrow)" /><path d="M600 290 V330 H600 V375" fill="none" stroke="#8c9b92" stroke-width="2" marker-end="url(#arrow)" /><path d="M600 290 V330 H990 V375" fill="none" stroke="#8c9b92" stroke-width="2" marker-end="url(#arrow)" /><rect x="35" y="375" width="350" height="250" rx="10" fill="#f3f6f3" stroke="#cedbd2" /><text x="210" y="418" text-anchor="middle" font-size="24" font-weight="600" fill="#254c38">学生模型初始化</text><path d="M60 438 H360" stroke="#cedbd2" /><text x="210" y="490" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">Causal Forcing</text><text x="210" y="520" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">因果教师进行 ODE 初始化</text><text x="210" y="560" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">Causal Forcing++</text><text x="210" y="590" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">一致性蒸馏初始化</text><rect x="425" y="375" width="350" height="250" rx="10" fill="#f3f6f3" stroke="#cedbd2" /><text x="600" y="418" text-anchor="middle" font-size="24" font-weight="600" fill="#254c38">长程训练</text><path d="M450 438 H750" stroke="#cedbd2" /><text x="600" y="490" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">LongLive</text><text x="600" y="520" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">流式长程训练</text><text x="600" y="560" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">Self-Forcing++</text><text x="600" y="590" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">短教师监督长轨迹</text><rect x="815" y="375" width="350" height="250" rx="10" fill="#f3f6f3" stroke="#cedbd2" /><text x="990" y="418" text-anchor="middle" font-size="24" font-weight="600" fill="#254c38">历史选择与位置编码</text><path d="M840 438 H1140" stroke="#cedbd2" /><text x="990" y="490" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">Deep Forcing</text><text x="990" y="520" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">历史锚点与 KV 筛选</text><text x="990" y="560" text-anchor="middle" font-size="22" font-weight="600" fill="#254c38">Infinity-RoPE</text><text x="990" y="590" text-anchor="middle" font-size="18" font-weight="400" fill="#53615a">局部时间坐标与位置外推</text></g></svg>